<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8C73FF">
<title>Speaky — Bring anything to life</title>
<meta name="description" content="Talk to your toys. Optionally unhinged characters. Speaky brings any object to life with a voice.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="canonical" href="https://iansidman.com/speaky/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://iansidman.com/speaky/">
<meta property="og:title" content="Speaky — Bring anything to life">
<meta property="og:description" content="Talk to your toys. Optionally unhinged characters.">
<meta property="og:image" content="https://iansidman.com/speaky/icon.png">
<meta property="og:site_name" content="Speaky">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Speaky — Bring anything to life">
<meta name="twitter:description" content="Talk to your toys. Optionally unhinged characters.">
<meta name="twitter:image" content="https://iansidman.com/speaky/icon.png">

<style>
  :root {
    --purple:       #8C73FF;
    --purple-dark:  #6B4DFF;
    --pink:         #FF7388;
    --lavender-tint:#FAF5FF;
    --ink:          #1A1228;
    --muted:        #665578;
    --line:         rgba(0, 0, 0, 0.08);
    --card:         #FAF7FF;
    --gradient:     linear-gradient(135deg, var(--pink), var(--purple));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 56px 24px 80px; }

  /* HERO */
  .logo {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    display: block;
    margin: 0 auto 28px;
    box-shadow: 0 10px 30px rgba(108, 77, 255, 0.20);
  }
  h1 {
    font-size: 34px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 28px;
    text-align: center;
  }
  h1 .hl {
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* CTA */
  .cta {
    display: block;
    width: 100%;
    text-align: center;
    background: #000;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    padding: 16px 20px;
    border-radius: 14px;
    margin-bottom: 56px;
    transition: transform 0.1s ease;
  }
  .cta:active { transform: scale(0.98); }
  .cta .apple {
    display: inline-block;
    vertical-align: -3px;
    margin-right: 8px;
  }

  /* SCREENSHOTS */
  .screens {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 48px;
  }
  .screens img {
    width: 100%;
    height: auto;
    border-radius: 14px;
    display: block;
    background: var(--card);
    aspect-ratio: 1179 / 2556;
    object-fit: cover;
  }

  /* MARKETING POINTS (below screenshots) */
  .points {
    text-align: center;
    margin-bottom: 56px;
  }
  .points p {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.3;
    color: var(--ink);
  }
  .points p + p { margin-top: 10px; }

  /* STACKED SHOWCASE SCREENSHOTS */
  .showcase {
    display: flex;
    flex-direction: column;
    gap: 28px;
    margin-bottom: 64px;
  }
  .showcase img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 22px;
    background: var(--card);
    aspect-ratio: 1179 / 2556;
    object-fit: cover;
    box-shadow:
      0 24px 60px rgba(108, 77, 255, 0.18),
      0 6px 16px rgba(0, 0, 0, 0.06);
  }

  /* CONTACT */
  .contact { text-align: center; }
  .contact a {
    display: inline-block;
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }

  /* FOOTER */
  .foot {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 40px;
  }
  .foot a {
    color: var(--muted);
    text-decoration: none;
  }
  .foot a:hover { color: var(--ink); }
  .foot .dot { margin: 0 8px; opacity: 0.5; }
</style>
</head>
<body>

<main class="wrap">

  <img class="logo" src="icon.png" alt="Speaky">
  <h1>Bring <span class="hl">anything</span> to life.</h1>

  <a class="cta" href="#" id="appStoreLink">
    <svg class="apple" width="16" height="18" viewBox="0 0 17 20" fill="#fff" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M13.6 10.6c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.2.9-4 2.5-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3.1 2.4 1.2-.1 1.7-.8 3.2-.8 1.5 0 1.9.8 3.2.7 1.3 0 2.2-1.2 3-2.4 1-1.4 1.4-2.7 1.4-2.8-.1 0-2.7-1-2.7-4z M11 3.5c.7-.8 1.1-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/>
    </svg>
    Install on the App Store
  </a>

  <section class="screens">
    <img src="screens/1-imagine.png" alt="">
    <img src="screens/2-character.png" alt="">
    <img src="screens/3-chat.png" alt="">
  </section>

  <section class="points">
    <p>Talk to your toys.</p>
    <p>Optionally unhinged characters 😂</p>
    <p>Create custom characters.</p>
  </section>

  <section class="showcase">
    <img src="screens/showcase-1.png" alt="">
    <img src="screens/showcase-2.png" alt="">
  </section>

  <div class="contact">
    <a href="mailto:viralbuildersllc@gmail.com?subject=Speaky">Contact</a>
  </div>

  <p class="foot">
    <a href="privacy/">Privacy</a>
    <span class="dot">·</span>
    <a href="terms/">Terms</a>
    <span class="dot">·</span>
    <a href="support/">Support</a>
    <span class="dot">·</span>
    © Viral Builders
  </p>

</main>

</body>
</html>
