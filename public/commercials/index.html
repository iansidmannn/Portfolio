<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commercial — the free screen time app</title>
<meta name="description" content="The free screen time app. Block the apps that pull you in. Watch ads to unlock." />

<link rel="icon" type="image/png" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />

<style>
  :root {
    --bg:        #000000;
    --ink:       #FFFFFF;
    --ink-soft:  #7C7C82;
    --line:      #1C1C1F;
    --card:      #0E0E10;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    display: block;
    margin: 0 auto 28px;
    border: 1.5px solid #3A3A3D;
  }
  h1 {
    font-size: 34px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 28px;
    text-align: center;
  }
  .rot {
    color: var(--ink);
    display: inline-block;
    transition: opacity 0.3s ease;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 2px;
  }
  .cta {
    display: block;
    width: 100%;
    text-align: center;
    background: #FFFFFF;
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    padding: 16px 20px;
    border-radius: 14px;
    margin-bottom: 56px;
    transition: transform 0.1s ease;
  }
  .cta:active { transform: scale(0.98); }
  .cta .apple {
    display: inline-block;
    vertical-align: -3px;
    margin-right: 8px;
  }
  .screens {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 64px;
  }
  .screens img {
    width: 100%;
    height: auto;
    border-radius: 14px;
    display: block;
    background: var(--card);
  }
  .contact {
    text-align: center;
  }
  .contact a {
    display: inline-block;
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .foot {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 40px;
  }
  .foot a {
    color: var(--ink-soft);
    text-decoration: none;
  }
  .foot a:hover { color: var(--ink); }
  .foot .dot { margin: 0 8px; opacity: 0.5; }
</style>
</head>
<body>
  <main class="wrap">
    <img class="icon" src="icon.png" alt="Commercial app icon" />
    <h1>
      The free screen time app for <span class="rot" id="rot">students</span>.
    </h1>

    <a class="cta" href="https://apps.apple.com/us/app/commercial-screentime-control/id6767307253" target="_blank" rel="noopener">
      <svg class="apple" width="16" height="18" viewBox="0 0 17 20" fill="#000" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13.6 10.6c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.2.9-4 2.5-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3.1 2.4 1.2-.1 1.7-.8 3.2-.8 1.5 0 1.9.8 3.2.7 1.3 0 2.2-1.2 3-2.4 1-1.4 1.4-2.7 1.4-2.8-.1 0-2.7-1-2.7-4z M11 3.5c.7-.8 1.1-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/>
      </svg>
      Install on the App Store
    </a>

    <section class="screens">
      <img src="screens/1-hero.png" alt="" />
      <img src="screens/2-block.png" alt="" />
      <img src="screens/3-install.png" alt="" />
    </section>

    <div class="contact">
      <a href="mailto:iansidman@gmail.com?subject=Commercial%20app">Contact</a>
    </div>

    <p class="foot">
      <a href="/commercials/support/">Support</a>
      <span class="dot">·</span>
      <a href="/commercials/privacy/">Privacy</a>
      <span class="dot">·</span>
      <a href="/commercials/terms/">Terms</a>
      <span class="dot">·</span>
      © Viral Builders
    </p>
  </main>

<script>
  (function () {
    var words = ["students", "builders", "focus"];
    var el = document.getElementById("rot");
    var i = 0;
    setInterval(function () {
      el.style.opacity = "0";
      setTimeout(function () {
        i = (i + 1) % words.length;
        el.textContent = words[i];
        el.style.opacity = "1";
      }, 300);
    }, 2200);
  })();
</script>
</body>
</html>
